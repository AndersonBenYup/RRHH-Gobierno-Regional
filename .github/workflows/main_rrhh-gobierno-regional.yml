name: Build and deploy ASP.Net Core app to Azure Web App - rrhh-gobierno-regional

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  SOLUCION: Proyecto-Evo-RRLL.slnx
  PROYECTO_WEB: Proyecto-Evo-RRLL/Proyecto-Evo-RRLL.csproj

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore ${{ env.SOLUCION }}

      - name: Build
        run: dotnet build ${{ env.SOLUCION }} --configuration Release --no-restore

      # SC-010: si alguna prueba falla, el job se detiene y no se despliega a Azure.
      - name: Test
        run: dotnet test ${{ env.SOLUCION }} --configuration Release --no-build --logger "trx;LogFileName=resultados.trx" --results-directory "${{ github.workspace }}/pruebas"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultados-pruebas
          path: "${{ github.workspace }}/pruebas"

      - name: Publish
        run: dotnet publish ${{ env.PROYECTO_WEB }} -c Release --no-build -o "${{ github.workspace }}/publicado"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: app
          path: "${{ github.workspace }}/publicado"

  deploy:
    runs-on: windows-latest
    needs: build
    if: github.event_name != 'pull_request'
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: app
          path: ./publicado

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_88C347DC9EFA4127BF4F5F4187500704 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_A95750996B424860ADCB3CF587E8472E }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_A495674B4EA44A38B8CDA3C47C901ED5 }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'rrhh-gobierno-regional'
          slot-name: 'Production'
          package: ./publicado
